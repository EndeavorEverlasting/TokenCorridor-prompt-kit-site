name: Moonwake live browser acceptance

on:
  pull_request:
    paths:
      - ".github/scripts/moonwake_browser_smoke.py"
      - ".github/workflows/moonwake-browser-acceptance.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/moonwake_browser_smoke.py"
      - ".github/workflows/moonwake-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser driver
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Exercise public GitHub Pages release
        run: python .github/scripts/moonwake_browser_smoke.py
      - name: Python source compile
        run: python -m compileall -q .github/scripts/moonwake_browser_smoke.py
