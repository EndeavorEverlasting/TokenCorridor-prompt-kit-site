name: Moonwake public Pages release

on:
  pull_request:
    paths:
      - "moonwake/**"
      - "prompt-library/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/moonwake-pages.yml"
      - ".github/scripts/verify_moonwake_live.py"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "moonwake/**"
      - "prompt-library/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/moonwake-pages.yml"
      - ".github/scripts/verify_moonwake_live.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonwake-public-release-proof
  cancel-in-progress: false

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Moonwake root, original R3 art, private-data boundary and catalog parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          root = Path(".")
          manifest = json.loads((root/"moonwake/release-manifest.v1.json").read_text())
          assert manifest["work_id"] == "PS-0208"
          assert manifest["boundaries"]["private_repo_remains_private"] is True
          assert manifest["publication"]["route"] == "/"
          for path, sha in manifest["assets"].items():
              assert (root/path).is_file(), path
              actual = subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual == sha, (path, actual, sha)
              if path.startswith("moonwake/assets/"):
                  mirror = path.removeprefix("moonwake/")
                  if (root/mirror).exists():
                      assert subprocess.check_output(["git","hash-object",mirror],text=True).strip() == sha
          home = (root/"index.html").read_bytes()
          moonwake = (root/"moonwake/index.html").read_bytes()
          assert home == moonwake, "Moonwake default entrypoint drift"
          assert b'<h1 id="hero-title">Moonwake</h1>' in home
          for forbidden in (b"127.0.0.1",b"localhost",b"file://",b"ya29.",b"ghp_",b"GOCSPX-",b"sk-proj-"):
              assert forbidden not in home, "unsafe public reference"
          for theme in (b'value="night"',b'value="light"',b'value="system"'):
              assert theme in home
          assert (root/"prompt-library/index.html").is_file()
          assert subprocess.check_output(["git","hash-object","prompt-library/index.html"],text=True).strip() == "650c5ba2830e45fde8cbf2348088017e4d496d2b"
          assert (root/"prompt-library/resources.v1.json").is_file()
          for name in ("Literata","Syne"):
              assert (root/f"assets/fonts/{name}-Variable.ttf").is_file()
              assert (root/f"assets/fonts/{name}-OFL.txt").is_file()
          print("PASS PS-0208 ROOT_MOONWAKE R3_SHA PRIVATE_BOUNDARY CATALOG_ORIGINAL")
          PY
      - name: Exact patch hygiene
        run: git diff --check HEAD~1..HEAD

  observe-public-pages:
    if: github.event_name != 'pull_request'
    needs: verify-publication
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Observe HTTP deployed by existing GitHub Pages branch publisher
        shell: bash
        run: python3 .github/scripts/verify_moonwake_live.py --revision "${{ github.sha }}"
